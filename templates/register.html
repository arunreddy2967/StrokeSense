<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StrokeSense | Create Account</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Header -->
    <header class="navbar">

        <a href="{{ url_for('home') }}" class="logo">
            <span class="logo-icon">🧠</span>
            <span>Stroke<span class="logo-highlight">Sense</span></span>
        </a>

    </header>


    <!-- Registration Section -->
    <main class="account-page">

        <div class="account-card">

            <div class="account-icon">
                🧠
            </div>

            <h1>Create Your Account</h1>

            <p class="account-subtitle">
                Join StrokeSense to track your health insights
                and take a proactive step toward prevention.
            </p>


            {% if message %}
                <p style="color: #2e7d32; margin-bottom: 15px;">
                    {{ message }}
                </p>
            {% endif %}


            {% if error %}
                <p style="color: #c62828; margin-bottom: 15px;">
                    {{ error }}
                </p>
            {% endif %}


            <form method="POST">

                <div class="form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit" class="account-button">
                    Create Account
                </button>

            </form>


            <p class="account-register">
                Already have an account?
                <a href="{{ url_for('account') }}">Sign In</a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        © 2026 StrokeSense.
    </footer>

</body>
</html>
